name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          OUTPUT_NAME="nasconnplus-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}v${{ matrix.goarm }}"
          fi
          VERSION="${TAG_NAME#v}"
          go build -trimpath -ldflags="-s -w -X 'github.com/dont-see-big-shark/nas_conn_plus/internal/app.Version=${VERSION}' -X 'github.com/dont-see-big-shark/nas_conn_plus/internal/app.BuildDate=${BUILD_DATE}'" -o nasconnplus ./cmd/nasconnplus
          tar -czvf "${OUTPUT_NAME}.tar.gz" nasconnplus config.example.json deploy/nasconnplus.service
          sha256sum "${OUTPUT_NAME}.tar.gz" > "${OUTPUT_NAME}.tar.gz.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nasconnplus-*.tar.gz
            nasconnplus-*.tar.gz.sha256

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Resolve Release Metadata
        id: release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          if ! [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${TAG_NAME}" >&2
            exit 1
          fi

          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"
          SOURCE_SHA256="$(curl -fsSL "${SOURCE_URL}" | sha256sum | awk '{print $1}')"
          if [[ ! "${SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not calculate source archive checksum" >&2
            exit 1
          fi

          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: dont-see-big-shark/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true

      - name: Update Formula
        working-directory: homebrew-tap
        run: |
          sed -E -i.bak \
            -e 's#archive/refs/tags/v[0-9]+(\.[0-9]+)+\.tar\.gz#archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz#g' \
            -e 's#^  sha256 "[0-9a-f]{64}"$#  sha256 "${{ steps.release.outputs.sha256 }}"#' \
            Formula/nasconnplus.rb
          rm -f Formula/nasconnplus.rb.bak

          grep -q "archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz" Formula/nasconnplus.rb
          grep -q 'sha256 "${{ steps.release.outputs.sha256 }}"' Formula/nasconnplus.rb
          git diff --check

      - name: Commit and Push Formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/nasconnplus.rb; then
            echo "Formula already at ${{ steps.release.outputs.tag }}"
            exit 0
          fi
          git add Formula/nasconnplus.rb
          git commit -m "nasconnplus: update to ${{ steps.release.outputs.version }}"
          git push origin main
