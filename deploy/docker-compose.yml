services:
  nasconnplus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nasconnplus:latest
    container_name: nasconnplus
    restart: unless-stopped
    # IMPORTANT: nasconnplus must use host networking and host pid namespace
    # to scan host listening ports directly and bind IPv6/HTTPS listeners.
    network_mode: host
    pid: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.json:/etc/nasconnplus/config.json
      - ./tls:/etc/nasconnplus/tls
      - ./acme_cache:/etc/nasconnplus/acme_cache
    environment:
      - TZ=Asia/Shanghai
