services:
  nasconnplus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/dont-see-big-shark/nas_conn_plus:latest
    container_name: nasconnplus
    restart: unless-stopped
    # IMPORTANT: nasconnplus requires host networking to inspect host listening ports
    # and bind IPv6 relay / HTTPS listeners on the host network.
    # Note: With /proc/self/fd socket inode tracking, pid: host and CAP_SYS_PTRACE are not needed.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config.json:/etc/nasconnplus/config.json
      - ./tls:/etc/nasconnplus/tls
      - ./acme_cache:/etc/nasconnplus/acme_cache
      - /run/nasconnplus:/run/nasconnplus
    environment:
      - TZ=Asia/Shanghai
